<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 402" role="img" aria-labelledby="concept-pin-guards-title concept-pin-guards-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-pin-guards-title">A pin guard holds an eviction constraint</title><desc id="concept-pin-guards-desc">Acquire page guard: pin count increases. Use page contents: pinned: do not evict. Destroy page guard: pin count decreases. Acquire page guard → Use page contents (then); Use page contents → Destroy page guard (then). An unpinned page becomes eligible for eviction; it is not necessarily evicted immediately. Dirty-page handling and host I/O errors are separate responsibilities.</desc>
    <defs><marker id="concept-pin-guards-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 150 110 L 150 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-pin-guards-arrow)" fill="none"/><path d="M 150 250 L 150 290" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-pin-guards-arrow)" fill="none"/>
    <g><rect x="82" y="10" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Acquire page</text><text x="150" y="52" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">guard</text><text x="150" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">pin count</text><text x="150" y="90" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">increases</text></g><g><rect x="82" y="150" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Use page</text><text x="150" y="192" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">contents</text><text x="150" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">pinned: do not</text><text x="150" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">evict</text></g><g><rect x="82" y="290" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="315" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Destroy page</text><text x="150" y="332" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">guard</text><text x="150" y="353" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">pin count</text><text x="150" y="370" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">decreases</text></g>
  </svg>
