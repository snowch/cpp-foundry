<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" width="400" height="262" viewBox="0 0 400 262" role="img" aria-labelledby="concept-heap-order-title concept-heap-order-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-heap-order-title">A minimum heap imposes a partial order</title><desc id="concept-heap-order-desc">Parent: minimum at the root. Left child: not below parent. Right child: not below parent. Parent → Left child (parent &lt;= child); Parent → Right child (parent &lt;= child). Each parent is no greater than its children. Siblings need not be ordered, and the underlying array is not a sorted sequence. Separate tie-breaking rules determine which equivalent-priority value comes first.</desc>
    <defs><marker id="concept-heap-order-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 200 110 L 100 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-heap-order-arrow)" fill="none"/><text x="20" y="134" text-anchor="start" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">parent &lt;= child</text><path d="M 200 110 L 300 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-heap-order-arrow)" fill="none"/><text x="380" y="134" text-anchor="end" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">parent &lt;= child</text>
    <g><rect x="120" y="10" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Parent</text><text x="200" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">minimum at the</text><text x="200" y="90" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">root</text></g><g><rect x="20" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="100" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Left child</text><text x="100" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">not below parent</text></g><g><rect x="220" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="300" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Right child</text><text x="300" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">not below parent</text></g>
  </svg>
