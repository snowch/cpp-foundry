<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 402" role="img" aria-labelledby="concept-hash-join-buckets-title concept-hash-join-buckets-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-hash-join-buckets-title">A join separates build and probe work</title><desc id="concept-hash-join-buckets-desc">Build side: group rows by join key. Probe side: look up matching bucket. Emit matching pairs: duplicates multiply rows. Build side → Probe side (then); Probe side → Emit matching pairs (then). Bucket membership produces candidates; the join still relies on equality semantics. Duplicate matches produce multiple pairs. An inner join drops unmatched rows; outer joins need an explicit unmatched-row policy.</desc>
    <defs><marker id="concept-hash-join-buckets-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56766c"/></marker></defs>
    <path d="M 150 110 L 150 150" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-hash-join-buckets-arrow)" fill="none"/><path d="M 150 250 L 150 290" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-hash-join-buckets-arrow)" fill="none"/>
    <g><rect x="82" y="10" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="35" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Build side</text><text x="150" y="73" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">group rows by</text><text x="150" y="90" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">join key</text></g><g><rect x="82" y="150" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="175" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Probe side</text><text x="150" y="213" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">look up matching</text><text x="150" y="230" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">bucket</text></g><g><rect x="82" y="290" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="315" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Emit matching</text><text x="150" y="332" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">pairs</text><text x="150" y="353" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">duplicates</text><text x="150" y="370" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">multiply rows</text></g>
  </svg>
