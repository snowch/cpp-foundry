<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 402" role="img" aria-labelledby="concept-oldest-reader-gc-title concept-oldest-reader-gc-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-oldest-reader-gc-title">An old reader keeps required versions alive</title><desc id="concept-oldest-reader-gc-desc">Register snapshot: reader keeps old revision. New commit: new version becomes current. Reader releases: reclaim unneeded history. Register snapshot → New commit (then); New commit → Reader releases (then). Reclamation must retain every version required by an active snapshot. This lesson is a bounded one-row MVCC model; releasing one reader does not permit deleting history still needed by another.</desc>
    <defs><marker id="concept-oldest-reader-gc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56766c"/></marker></defs>
    <path d="M 150 110 L 150 150" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-oldest-reader-gc-arrow)" fill="none"/><path d="M 150 250 L 150 290" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-oldest-reader-gc-arrow)" fill="none"/>
    <g><rect x="82" y="10" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="35" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Register</text><text x="150" y="52" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">snapshot</text><text x="150" y="73" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">reader keeps old</text><text x="150" y="90" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">revision</text></g><g><rect x="82" y="150" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="175" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">New commit</text><text x="150" y="213" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">new version</text><text x="150" y="230" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">becomes current</text></g><g><rect x="82" y="290" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="315" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Reader</text><text x="150" y="332" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">releases</text><text x="150" y="353" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">reclaim unneeded</text><text x="150" y="370" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">history</text></g>
  </svg>
