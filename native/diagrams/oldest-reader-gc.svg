<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" width="400" height="402" viewBox="0 0 400 402" role="img" aria-labelledby="concept-oldest-reader-gc-title concept-oldest-reader-gc-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-oldest-reader-gc-title">An old reader keeps required versions alive</title><desc id="concept-oldest-reader-gc-desc">Register snapshot: reader keeps old revision. New commit: new version becomes current. Reader releases: reclaim unneeded history. Register snapshot → New commit (then); New commit → Reader releases (then). Reclamation must retain every version required by an active snapshot. This lesson is a bounded one-row MVCC model; releasing one reader does not permit deleting history still needed by another.</desc>
    <defs><marker id="concept-oldest-reader-gc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 200 110 L 200 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-oldest-reader-gc-arrow)" fill="none"/><text x="214" y="134" text-anchor="start" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">then</text><path d="M 200 250 L 200 290" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-oldest-reader-gc-arrow)" fill="none"/><text x="214" y="274" text-anchor="start" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">then</text>
    <g><rect x="120" y="10" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Register</text><text x="200" y="52" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">snapshot</text><text x="200" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">reader keeps old</text><text x="200" y="90" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">revision</text></g><g><rect x="120" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">New commit</text><text x="200" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">new version</text><text x="200" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">becomes current</text></g><g><rect x="120" y="290" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="315" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Reader</text><text x="200" y="332" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">releases</text><text x="200" y="353" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">reclaim unneeded</text><text x="200" y="370" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">history</text></g>
  </svg>
