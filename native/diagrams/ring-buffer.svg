<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 402" role="img" aria-labelledby="concept-ring-buffer-title concept-ring-buffer-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-ring-buffer-title">Queue positions wrap within fixed storage</title><desc id="concept-ring-buffer-desc">Push at tail: if capacity permits. Advance tail: wrap modulo capacity. Pop at head: advance head similarly. Push at tail → Advance tail (then); Advance tail → Pop at head (then). Head and tail positions alone may not distinguish empty from full. The lesson maintains an explicit size; wrapping positions does not overwrite a live element when the full check rejects insertion.</desc>
    <defs><marker id="concept-ring-buffer-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56766c"/></marker></defs>
    <path d="M 150 110 L 150 150" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-ring-buffer-arrow)" fill="none"/><path d="M 150 250 L 150 290" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-ring-buffer-arrow)" fill="none"/>
    <g><rect x="82" y="10" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="35" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Push at tail</text><text x="150" y="73" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">if capacity</text><text x="150" y="90" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">permits</text></g><g><rect x="82" y="150" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="175" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Advance tail</text><text x="150" y="213" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">wrap modulo</text><text x="150" y="230" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">capacity</text></g><g><rect x="82" y="290" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="315" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Pop at head</text><text x="150" y="353" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">advance head</text><text x="150" y="370" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">similarly</text></g>
  </svg>
