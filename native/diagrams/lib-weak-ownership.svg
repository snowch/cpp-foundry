<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 262" role="img" aria-labelledby="concept-lib-weak-ownership-title concept-lib-weak-ownership-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-lib-weak-ownership-title">Lock a weak observer before using the value</title><desc id="concept-lib-weak-ownership-desc">Shared owner: keeps value alive. Weak observer: does not own value. lock succeeds: temporary shared owner. Shared owner → lock succeeds (shared lifetime); Weak observer → lock succeeds (lock if alive, dashed arrow). A successful lock holds ownership while the value is used. Once strong ownership ends, later lock attempts fail. The arrows describe lifetime relationships, not synchronization of mutable object state.</desc>
    <defs><marker id="concept-lib-weak-ownership-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56766c"/></marker></defs>
    <path d="M 75 110 L 150 150" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-lib-weak-ownership-arrow)" fill="none"/><path d="M 225 110 L 150 150" stroke="#56766c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#concept-lib-weak-ownership-arrow)" fill="none"/>
    <g><rect x="7" y="10" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="75" y="35" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Shared owner</text><text x="75" y="73" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">keeps value</text><text x="75" y="90" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">alive</text></g><g><rect x="157" y="10" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="225" y="35" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Weak observer</text><text x="225" y="73" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">does not own</text><text x="225" y="90" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">value</text></g><g><rect x="82" y="150" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="175" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">lock succeeds</text><text x="150" y="213" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">temporary shared</text><text x="150" y="230" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">owner</text></g>
  </svg>
