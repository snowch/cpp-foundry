<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" width="400" height="262" viewBox="0 0 400 262" role="img" aria-labelledby="concept-lib-weak-ownership-title concept-lib-weak-ownership-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-lib-weak-ownership-title">Lock a weak observer before using the value</title><desc id="concept-lib-weak-ownership-desc">Shared owner: keeps value alive. Weak observer: does not own value. lock succeeds: temporary shared owner. Shared owner → lock succeeds (shared lifetime); Weak observer → lock succeeds (lock if alive, dashed arrow). A successful lock holds ownership while the value is used. Once strong ownership ends, later lock attempts fail. The arrows describe lifetime relationships, not synchronization of mutable object state.</desc>
    <defs><marker id="concept-lib-weak-ownership-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 100 110 L 200 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-lib-weak-ownership-arrow)" fill="none"/><text x="380" y="134" text-anchor="end" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">shared lifetime</text><path d="M 300 110 L 200 150" stroke="#7866d9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#concept-lib-weak-ownership-arrow)" fill="none"/><text x="20" y="134" text-anchor="start" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">lock if alive</text>
    <g><rect x="20" y="10" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="100" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Shared owner</text><text x="100" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">keeps value</text><text x="100" y="90" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">alive</text></g><g><rect x="220" y="10" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="300" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Weak observer</text><text x="300" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">does not own</text><text x="300" y="90" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">value</text></g><g><rect x="120" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">lock succeeds</text><text x="200" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">temporary shared</text><text x="200" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">owner</text></g>
  </svg>
