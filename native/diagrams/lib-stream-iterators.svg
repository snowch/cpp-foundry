    <title id="concept-lib-stream-iterators-title">A stream iterator consumes one shared input</title><desc id="concept-lib-stream-iterators-desc">Input characters: 3 4 5. Input iterator: extracts values once. Accumulator: total becomes 12. Input characters → Input iterator (then); Input iterator → Accumulator (then). The stream is consumed as accumulation proceeds. Copying an input iterator does not produce an independently rewindable source; materialize values when multiple passes are needed.</desc>
    <defs><marker id="concept-lib-stream-iterators-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 200 110 L 200 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-lib-stream-iterators-arrow)" fill="none"/><text x="214" y="134" text-anchor="start" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">then</text><path d="M 200 250 L 200 290" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-lib-stream-iterators-arrow)" fill="none"/><text x="214" y="274" text-anchor="start" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">then</text>
    <g><rect x="120" y="10" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Input</text><text x="200" y="52" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">characters</text><text x="200" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">3 4 5</text></g><g><rect x="120" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Input iterator</text><text x="200" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">extracts values</text><text x="200" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">once</text></g><g><rect x="120" y="290" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="315" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Accumulator</text><text x="200" y="353" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">total becomes 12</text></g>
  </svg>
