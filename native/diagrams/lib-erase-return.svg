    <title id="concept-lib-erase-return-title">An erase loop has two different next steps</title><desc id="concept-lib-erase-return-desc">Current iterator: inspect the value. Keep element: increment iterator. Erase element: take returned iterator. Current iterator → Keep element (keep); Current iterator → Erase element (erase). The keep branch increments. The erase branch uses the iterator returned by vector::erase without incrementing again; the old iterator and later vector positions are invalidated.</desc>
    <defs><marker id="concept-lib-erase-return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 200 110 L 100 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-lib-erase-return-arrow)" fill="none"/><text x="20" y="134" text-anchor="start" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">keep</text><path d="M 200 110 L 300 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-lib-erase-return-arrow)" fill="none"/><text x="380" y="134" text-anchor="end" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">erase</text>
    <g><rect x="120" y="10" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Current</text><text x="200" y="52" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">iterator</text><text x="200" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">inspect the</text><text x="200" y="90" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">value</text></g><g><rect x="20" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="100" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Keep element</text><text x="100" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">increment</text><text x="100" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">iterator</text></g><g><rect x="220" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="300" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Erase element</text><text x="300" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">take returned</text><text x="300" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">iterator</text></g>
  </svg>
