<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 262" role="img" aria-labelledby="concept-memoization-title concept-memoization-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-memoization-title">Cache completed subproblems</title><desc id="concept-memoization-desc">Request a subproblem: look up its key. Cache hit: reuse saved result. Cache miss: compute and store. Request a subproblem → Cache hit (found); Request a subproblem → Cache miss (absent). Memoization avoids recomputing the same completed state. The cache key must include every input that affects the answer; caching does not by itself prevent cycles in recursive dependencies.</desc>
    <defs><marker id="concept-memoization-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56766c"/></marker></defs>
    <path d="M 150 110 L 75 150" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-memoization-arrow)" fill="none"/><path d="M 150 110 L 225 150" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-memoization-arrow)" fill="none"/>
    <g><rect x="82" y="10" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="35" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Request a</text><text x="150" y="52" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">subproblem</text><text x="150" y="73" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">look up its key</text></g><g><rect x="7" y="150" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="75" y="175" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Cache hit</text><text x="75" y="213" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">reuse saved result</text></g><g><rect x="157" y="150" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="225" y="175" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Cache miss</text><text x="225" y="213" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">compute and store</text></g>
  </svg>
