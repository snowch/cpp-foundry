<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" width="400" height="262" viewBox="0 0 400 262" role="img" aria-labelledby="concept-memoization-title concept-memoization-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-memoization-title">Cache completed subproblems</title><desc id="concept-memoization-desc">Request a subproblem: look up its key. Cache hit: reuse saved result. Cache miss: compute and store. Request a subproblem → Cache hit (found); Request a subproblem → Cache miss (absent). Memoization avoids recomputing the same completed state. The cache key must include every input that affects the answer; caching does not by itself prevent cycles in recursive dependencies.</desc>
    <defs><marker id="concept-memoization-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 200 110 L 100 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-memoization-arrow)" fill="none"/><text x="20" y="134" text-anchor="start" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">found</text><path d="M 200 110 L 300 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-memoization-arrow)" fill="none"/><text x="380" y="134" text-anchor="end" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">absent</text>
    <g><rect x="120" y="10" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Request a</text><text x="200" y="52" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">subproblem</text><text x="200" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">look up its key</text></g><g><rect x="20" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="100" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Cache hit</text><text x="100" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">reuse saved</text><text x="100" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">result</text></g><g><rect x="220" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="300" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Cache miss</text><text x="300" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">compute and</text><text x="300" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">store</text></g>
  </svg>
