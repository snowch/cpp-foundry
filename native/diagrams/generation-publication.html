</style><figure class="concept-diagram learning-model" data-model="generation-publication" aria-labelledby="lm-generation-publication"><figcaption><h3 id="lm-generation-publication">Old readers retain the old generation</h3><p>Why is old_size 3 while new_size is 2?</p></figcaption><section class="lm-state"><h4>Before publication</h4><div class="lm-objects"><div class="lm-object-group"><div class="lm-ref-names" style="--refs:2"><div><strong class="lm-binding">current</strong><span class="lm-edge-label">shared owner</span></div><div><strong class="lm-binding">reader</strong><span class="lm-edge-label">shared owner</span></div></div><svg class="lm-ref-lines" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M25 1V11L50 25 M46 20L50 25L54 20"/><path d="M75 1V11L50 25 M46 20L50 25L54 20"/></svg><div class="lm-object "><span class="lm-object-label">Old immutable vector</span><strong class="lm-object-value">[1,2,3]</strong></div></div></div></section><section class="lm-state"><h4>After replacing current</h4><div class="lm-objects"><div class="lm-object-group"><div class="lm-ref-names" style="--refs:1"><div><strong class="lm-binding">reader</strong><span class="lm-edge-label">keeps old generation alive</span></div></div><svg class="lm-ref-lines" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M50 1V11L50 25 M46 20L50 25L54 20"/></svg><div class="lm-object "><span class="lm-object-label">Old immutable vector</span><strong class="lm-object-value">[1,2,3]</strong></div></div><div class="lm-object-group"><div class="lm-ref-names" style="--refs:1"><div><strong class="lm-binding">current</strong><span class="lm-edge-label">owns new generation</span></div></div><svg class="lm-ref-lines" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M50 1V11L50 25 M46 20L50 25L54 20"/></svg><div class="lm-object "><span class="lm-object-label">New immutable vector</span><strong class="lm-object-value">[2,3]</strong></div></div></div></section><p class="lm-note">The old generation can be reclaimed only after its last owner releases it. Replacing a handle is separate from reclamation and does not prove durable file replacement.</p><p class="lm-scope">Illustration of the supplied example. Editing the program does not update this picture.</p><details class="lm-description"><summary>Diagram in words</summary><p>Why is old_size 3 while new_size is 2? Before publication: Old immutable vector contains [1,2,3]. current shared owner Old immutable vector; reader shared owner Old immutable vector. After replacing current: Old immutable vector contains [1,2,3]. reader keeps old generation alive Old immutable vector; New immutable vector contains [2,3]. current owns new generation New immutable vector. The old generation can be reclaimed only after its last owner releases it. Replacing a handle is separate from reclamation and does not prove durable file replacement.</p></details></figure></html>
