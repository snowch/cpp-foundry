<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" width="400" height="402" viewBox="0 0 400 402" role="img" aria-labelledby="concept-lib-charconv-complete-title concept-lib-charconv-complete-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-lib-charconv-complete-title">A successful prefix is not a complete field</title><desc id="concept-lib-charconv-complete-desc">Text: 42x: parse starts at 4. from_chars: value 42; stops at x. Full-field check: reject trailing text. Text: 42x → from_chars (then); from_chars → Full-field check (then). Accept a complete integer field only when the error code is clear and the stopping pointer reaches the end. Range errors and an invalid first character are distinct failure cases.</desc>
    <defs><marker id="concept-lib-charconv-complete-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 200 110 L 200 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-lib-charconv-complete-arrow)" fill="none"/><text x="214" y="134" text-anchor="start" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">then</text><path d="M 200 250 L 200 290" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-lib-charconv-complete-arrow)" fill="none"/><text x="214" y="274" text-anchor="start" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">then</text>
    <g><rect x="120" y="10" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Text: 42x</text><text x="200" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">parse starts at</text><text x="200" y="90" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">4</text></g><g><rect x="120" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">from_chars</text><text x="200" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">value 42; stops</text><text x="200" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">at x</text></g><g><rect x="120" y="290" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="315" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Full-field</text><text x="200" y="332" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">check</text><text x="200" y="353" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">reject trailing</text><text x="200" y="370" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">text</text></g>
  </svg>
