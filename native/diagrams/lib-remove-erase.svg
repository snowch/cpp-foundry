<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 402" role="img" aria-labelledby="concept-lib-remove-erase-title concept-lib-remove-erase-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-lib-remove-erase-title">Logical removal precedes physical erasure</title><desc id="concept-lib-remove-erase-desc">Initial sequence: 1 2 2 3 : size 4. After remove(2): retained prefix: 1 3. After erase: size 2; suffix removed. Initial sequence → After remove(2) (then); After remove(2) → After erase (then). remove returns the logical end without shrinking the vector. The trailing values after remove are unspecified; the diagram deliberately does not depict them as the removed elements.</desc>
    <defs><marker id="concept-lib-remove-erase-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 150 110 L 150 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-lib-remove-erase-arrow)" fill="none"/><path d="M 150 250 L 150 290" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-lib-remove-erase-arrow)" fill="none"/>
    <g><rect x="82" y="10" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Initial</text><text x="150" y="52" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">sequence</text><text x="150" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">1 2 2 3 : size 4</text></g><g><rect x="82" y="150" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">After</text><text x="150" y="192" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">remove(2)</text><text x="150" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">retained prefix:</text><text x="150" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">1 3</text></g><g><rect x="82" y="290" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="315" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">After erase</text><text x="150" y="353" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">size 2; suffix</text><text x="150" y="370" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">removed</text></g>
  </svg>
