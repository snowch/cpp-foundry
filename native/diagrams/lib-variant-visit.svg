<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" width="400" height="262" viewBox="0 0 400 262" role="img" aria-labelledby="concept-lib-variant-visit-title concept-lib-variant-visit-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-lib-variant-visit-title">A tag chooses one active alternative</title><desc id="concept-lib-variant-visit-desc">Variant tag: which alternative?. Integer active: visit integer handler. String active: visit string handler. Variant tag → Integer active (integer); Variant tag → String active (string). Only the active branch is visited. The visitor must be well-formed for all alternatives. This shows the ordinary active-value case, not a possible valueless_by_exception state.</desc>
    <defs><marker id="concept-lib-variant-visit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 200 110 L 100 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-lib-variant-visit-arrow)" fill="none"/><text x="20" y="134" text-anchor="start" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">integer</text><path d="M 200 110 L 300 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-lib-variant-visit-arrow)" fill="none"/><text x="380" y="134" text-anchor="end" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">string</text>
    <g><rect x="120" y="10" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Variant tag</text><text x="200" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">which</text><text x="200" y="90" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">alternative?</text></g><g><rect x="20" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="100" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Integer active</text><text x="100" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">visit integer</text><text x="100" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">handler</text></g><g><rect x="220" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="300" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">String active</text><text x="300" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">visit string</text><text x="300" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">handler</text></g>
  </svg>
