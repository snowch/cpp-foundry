<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 262" role="img" aria-labelledby="concept-lib-variant-visit-title concept-lib-variant-visit-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-lib-variant-visit-title">A tag chooses one active alternative</title><desc id="concept-lib-variant-visit-desc">Variant tag: which alternative?. Integer active: visit integer handler. String active: visit string handler. Variant tag → Integer active (integer); Variant tag → String active (string). Only the active branch is visited. The visitor must be well-formed for all alternatives. This shows the ordinary active-value case, not a possible valueless_by_exception state.</desc>
    <defs><marker id="concept-lib-variant-visit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56766c"/></marker></defs>
    <path d="M 150 110 L 75 150" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-lib-variant-visit-arrow)" fill="none"/><path d="M 150 110 L 225 150" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-lib-variant-visit-arrow)" fill="none"/>
    <g><rect x="82" y="10" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="35" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Variant tag</text><text x="150" y="73" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">which</text><text x="150" y="90" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">alternative?</text></g><g><rect x="7" y="150" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="75" y="175" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Integer active</text><text x="75" y="213" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">visit integer</text><text x="75" y="230" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">handler</text></g><g><rect x="157" y="150" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="225" y="175" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">String active</text><text x="225" y="213" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">visit string</text><text x="225" y="230" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">handler</text></g>
  </svg>
