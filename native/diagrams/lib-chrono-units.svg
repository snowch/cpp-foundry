<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 402" role="img" aria-labelledby="concept-lib-chrono-units-title concept-lib-chrono-units-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-lib-chrono-units-title">Duration conversion can discard a remainder</title><desc id="concept-lib-chrono-units-desc">2 seconds + 750 ms: common unit: ms. 2750 milliseconds: duration count: 2750. Cast to whole seconds: 2; fractional part lost. 2 seconds + 750 ms → 2750 milliseconds (then); 2750 milliseconds → Cast to whole seconds (then). This fixture uses positive durations. duration_cast to integral seconds truncates toward zero; floor and round express other policies, particularly for negative values.</desc>
    <defs><marker id="concept-lib-chrono-units-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 150 110 L 150 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-lib-chrono-units-arrow)" fill="none"/><path d="M 150 250 L 150 290" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-lib-chrono-units-arrow)" fill="none"/>
    <g><rect x="82" y="10" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">2 seconds +</text><text x="150" y="52" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">750 ms</text><text x="150" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">common unit: ms</text></g><g><rect x="82" y="150" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">2750</text><text x="150" y="192" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">milliseconds</text><text x="150" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">duration count:</text><text x="150" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">2750</text></g><g><rect x="82" y="290" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="315" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Cast to whole</text><text x="150" y="332" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">seconds</text><text x="150" y="353" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">2; fractional</text><text x="150" y="370" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">part lost</text></g>
  </svg>
