<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 402" role="img" aria-labelledby="concept-lib-vector-invalidation-title concept-lib-vector-invalidation-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-lib-vector-invalidation-title">Reallocation changes where elements live</title><desc id="concept-lib-vector-invalidation-desc">Before reserve: elements in old storage. Capacity grows: new storage allocated. After reallocation: reacquire element access. Before reserve → Capacity grows (then); Capacity grows → After reallocation (then). Pointers, references, and iterators into the old vector storage are invalidated. An index is useful only if other edits have not changed positions; reserve changes capacity, not size.</desc>
    <defs><marker id="concept-lib-vector-invalidation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56766c"/></marker></defs>
    <path d="M 150 110 L 150 150" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-lib-vector-invalidation-arrow)" fill="none"/><path d="M 150 250 L 150 290" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-lib-vector-invalidation-arrow)" fill="none"/>
    <g><rect x="82" y="10" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="35" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Before reserve</text><text x="150" y="73" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">elements in old</text><text x="150" y="90" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">storage</text></g><g><rect x="82" y="150" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="175" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Capacity grows</text><text x="150" y="213" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">new storage</text><text x="150" y="230" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">allocated</text></g><g><rect x="82" y="290" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="315" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">After</text><text x="150" y="332" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">reallocation</text><text x="150" y="353" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">reacquire element</text><text x="150" y="370" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">access</text></g>
  </svg>
