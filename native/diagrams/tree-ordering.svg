<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 262" role="img" aria-labelledby="concept-tree-ordering-title concept-tree-ordering-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-tree-ordering-title">Search-tree ordering divides the key domain</title><desc id="concept-tree-ordering-desc">Root key: 20. Left subtree: keys below 20. Right subtree: keys above 20. Root key → Left subtree (less); Root key → Right subtree (greater). This schematic assumes unique keys. Every descendant, not just each immediate child, must satisfy its ancestor bounds. Balance and ownership are additional invariants, not consequences of ordering.</desc>
    <defs><marker id="concept-tree-ordering-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 150 110 L 75 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-tree-ordering-arrow)" fill="none"/><path d="M 150 110 L 225 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-tree-ordering-arrow)" fill="none"/>
    <g><rect x="82" y="10" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Root key</text><text x="150" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">20</text></g><g><rect x="7" y="150" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="75" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Left subtree</text><text x="75" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">keys below 20</text></g><g><rect x="157" y="150" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="225" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Right subtree</text><text x="225" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">keys above 20</text></g>
  </svg>
