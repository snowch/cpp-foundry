<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 262" role="img" aria-labelledby="concept-observer-owner-title concept-observer-owner-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-observer-owner-title">Ownership and observation are different edges</title><desc id="concept-observer-owner-desc">Owner: controls lifetime. Observer: borrows access. Resource: must still be alive. Owner → Resource (owns); Observer → Resource (borrows, dashed arrow). Solid arrow: ownership. Dashed arrow: observation. Destroying the owner can invalidate the observer; the observer does not prolong the resource lifetime.</desc>
    <defs><marker id="concept-observer-owner-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56766c"/></marker></defs>
    <path d="M 75 110 L 150 150" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-observer-owner-arrow)" fill="none"/><path d="M 225 110 L 150 150" stroke="#56766c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#concept-observer-owner-arrow)" fill="none"/>
    <g><rect x="7" y="10" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="75" y="35" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Owner</text><text x="75" y="73" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">controls</text><text x="75" y="90" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">lifetime</text></g><g><rect x="157" y="10" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="225" y="35" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Observer</text><text x="225" y="73" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">borrows access</text></g><g><rect x="82" y="150" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="175" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Resource</text><text x="150" y="213" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">must still be</text><text x="150" y="230" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">alive</text></g>
  </svg>
