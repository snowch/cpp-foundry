<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" width="400" height="262" viewBox="0 0 400 262" role="img" aria-labelledby="concept-observer-owner-title concept-observer-owner-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-observer-owner-title">Ownership and observation are different edges</title><desc id="concept-observer-owner-desc">Owner: controls lifetime. Observer: borrows access. Resource: must still be alive. Owner → Resource (owns); Observer → Resource (borrows, dashed arrow). Solid arrow: ownership. Dashed arrow: observation. Destroying the owner can invalidate the observer; the observer does not prolong the resource lifetime.</desc>
    <defs><marker id="concept-observer-owner-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 100 110 L 200 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-observer-owner-arrow)" fill="none"/><text x="380" y="134" text-anchor="end" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">owns</text><path d="M 300 110 L 200 150" stroke="#7866d9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#concept-observer-owner-arrow)" fill="none"/><text x="20" y="134" text-anchor="start" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">borrows</text>
    <g><rect x="20" y="10" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="100" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Owner</text><text x="100" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">controls</text><text x="100" y="90" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">lifetime</text></g><g><rect x="220" y="10" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="300" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Observer</text><text x="300" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">borrows access</text></g><g><rect x="120" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Resource</text><text x="200" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">must still be</text><text x="200" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">alive</text></g>
  </svg>
