<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" width="400" height="402" viewBox="0 0 400 402" role="img" aria-labelledby="concept-lib-future-promise-title concept-lib-future-promise-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-lib-future-promise-title">A shared state carries a value or exception</title><desc id="concept-lib-future-promise-desc">Producer: promise sets result. Shared state: becomes ready. Consumer future: get waits and observes. Producer → Shared state (then); Shared state → Consumer future (then). An ordinary future permits one get. An exception is transported through the same shared state. Result readiness does not provide a general lock for later mutations of unrelated shared objects.</desc>
    <defs><marker id="concept-lib-future-promise-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 200 110 L 200 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-lib-future-promise-arrow)" fill="none"/><text x="214" y="134" text-anchor="start" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">then</text><path d="M 200 250 L 200 290" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-lib-future-promise-arrow)" fill="none"/><text x="214" y="274" text-anchor="start" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">then</text>
    <g><rect x="120" y="10" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Producer</text><text x="200" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">promise sets</text><text x="200" y="90" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">result</text></g><g><rect x="120" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Shared state</text><text x="200" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">becomes ready</text></g><g><rect x="120" y="290" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="315" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Consumer</text><text x="200" y="332" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">future</text><text x="200" y="353" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">get waits and</text><text x="200" y="370" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">observes</text></g>
  </svg>
