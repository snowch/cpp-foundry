<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 402" role="img" aria-labelledby="concept-breadth-first-title concept-breadth-first-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-breadth-first-title">Breadth-first traversal expands a frontier</title><desc id="concept-breadth-first-desc">Start vertex: mark and enqueue. FIFO frontier: pop earliest discovery. Undiscovered neighbors: mark and enqueue. Start vertex → FIFO frontier (then); FIFO frontier → Undiscovered neighbors (then). The FIFO queue explores unweighted distance layers. Marking a vertex on discovery prevents repeated enqueues; weighted shortest paths require a different contract. Repeat the expansion until the queue is empty.</desc>
    <defs><marker id="concept-breadth-first-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 150 110 L 150 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-breadth-first-arrow)" fill="none"/><path d="M 150 250 L 150 290" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-breadth-first-arrow)" fill="none"/>
    <g><rect x="82" y="10" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Start vertex</text><text x="150" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">mark and enqueue</text></g><g><rect x="82" y="150" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">FIFO frontier</text><text x="150" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">pop earliest</text><text x="150" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">discovery</text></g><g><rect x="82" y="290" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="315" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Undiscovered</text><text x="150" y="332" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">neighbors</text><text x="150" y="353" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">mark and enqueue</text></g>
  </svg>
