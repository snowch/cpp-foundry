<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 402" role="img" aria-labelledby="concept-codec-candidate-import-title concept-codec-candidate-import-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-codec-candidate-import-title">Publish decoded state only after validation</title><desc id="concept-codec-candidate-import-desc">Untrusted bytes: check lengths and fields. Candidate state: validate full structure. Publish candidate: replace committed state. Untrusted bytes → Candidate state (then); Candidate state → Publish candidate (then). Any rejected field, duplicate, or trailing byte leaves the previous state intact. This is failure preservation within the model, not an operating-system crash-durability guarantee.</desc>
    <defs><marker id="concept-codec-candidate-import-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56766c"/></marker></defs>
    <path d="M 150 110 L 150 150" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-codec-candidate-import-arrow)" fill="none"/><path d="M 150 250 L 150 290" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-codec-candidate-import-arrow)" fill="none"/>
    <g><rect x="82" y="10" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="35" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Untrusted bytes</text><text x="150" y="73" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">check lengths and</text><text x="150" y="90" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">fields</text></g><g><rect x="82" y="150" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="175" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Candidate state</text><text x="150" y="213" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">validate full</text><text x="150" y="230" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">structure</text></g><g><rect x="82" y="290" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="315" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Publish</text><text x="150" y="332" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">candidate</text><text x="150" y="353" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">replace committed</text><text x="150" y="370" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">state</text></g>
  </svg>
