<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 262" role="img" aria-labelledby="concept-bplus-routing-title concept-bplus-routing-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-bplus-routing-title">A separator routes a search to a leaf</title><desc id="concept-bplus-routing-desc">Root separator: routing boundary. Left leaf: keys below boundary. Right leaf: keys at/above it. Root separator → Left leaf (lower keys); Root separator → Right leaf (other keys). The separator is a routing fence for this bounded teaching index. This is not an arbitrary-height production B+ tree. A range scan can continue across leaves after routing to its starting leaf.</desc>
    <defs><marker id="concept-bplus-routing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56766c"/></marker></defs>
    <path d="M 150 110 L 75 150" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-bplus-routing-arrow)" fill="none"/><path d="M 150 110 L 225 150" stroke="#56766c" stroke-width="1.5"  marker-end="url(#concept-bplus-routing-arrow)" fill="none"/>
    <g><rect x="82" y="10" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="150" y="35" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Root separator</text><text x="150" y="73" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">routing boundary</text></g><g><rect x="7" y="150" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="75" y="175" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Left leaf</text><text x="75" y="213" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">keys below</text><text x="75" y="230" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">boundary</text></g><g><rect x="157" y="150" width="136" height="100" rx="7" fill="#fffefa" stroke="#aebfb4"/><text x="225" y="175" text-anchor="middle" fill="#193039" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Right leaf</text><text x="225" y="213" text-anchor="middle" fill="#4d645e" font-family="system-ui,sans-serif" font-size="12.5">keys at/above it</text></g>
  </svg>
