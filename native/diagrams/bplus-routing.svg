<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" width="400" height="262" viewBox="0 0 400 262" role="img" aria-labelledby="concept-bplus-routing-title concept-bplus-routing-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-bplus-routing-title">A separator routes a search to a leaf</title><desc id="concept-bplus-routing-desc">Root separator: routing boundary. Left leaf: keys below boundary. Right leaf: keys at/above it. Root separator → Left leaf (lower keys); Root separator → Right leaf (other keys). The separator is a routing fence for this bounded teaching index. This is not an arbitrary-height production B+ tree. A range scan can continue across leaves after routing to its starting leaf.</desc>
    <defs><marker id="concept-bplus-routing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 200 110 L 100 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-bplus-routing-arrow)" fill="none"/><text x="20" y="134" text-anchor="start" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">lower keys</text><path d="M 200 110 L 300 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-bplus-routing-arrow)" fill="none"/><text x="380" y="134" text-anchor="end" fill="#44445b" font-family="system-ui,sans-serif" font-size="16">other keys</text>
    <g><rect x="120" y="10" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="200" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Root separator</text><text x="200" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">routing boundary</text></g><g><rect x="20" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="100" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Left leaf</text><text x="100" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">keys below</text><text x="100" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">boundary</text></g><g><rect x="220" y="150" width="160" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="300" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Right leaf</text><text x="300" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="16">keys at/above it</text></g>
  </svg>
