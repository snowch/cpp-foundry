<svg xmlns="http://www.w3.org/2000/svg" class="concept-svg" viewBox="0 0 300 402" role="img" aria-labelledby="concept-sql-select-ast-title concept-sql-select-ast-desc">
    <metadata>Copyright © 2026 Christopher Snow. All rights reserved. Original concept diagram for C++ Foundry.</metadata>
    <title id="concept-sql-select-ast-title">Keep parsing separate from execution</title><desc id="concept-sql-select-ast-desc">SQL text: external characters. Lexer and parser: tokens become an AST. Validated query: execution may begin. SQL text → Lexer and parser (then); Lexer and parser → Validated query (then). The parser recognizes only the documented SELECT subset and rejects trailing tokens. Constructing an AST does not execute a query or imply support for the full SQL language.</desc>
    <defs><marker id="concept-sql-select-ast-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7866d9"/></marker></defs>
    <path d="M 150 110 L 150 150" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-sql-select-ast-arrow)" fill="none"/><path d="M 150 250 L 150 290" stroke="#7866d9" stroke-width="1.5"  marker-end="url(#concept-sql-select-ast-arrow)" fill="none"/>
    <g><rect x="82" y="10" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="35" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">SQL text</text><text x="150" y="73" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">external</text><text x="150" y="90" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">characters</text></g><g><rect x="82" y="150" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="175" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Lexer and</text><text x="150" y="192" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">parser</text><text x="150" y="213" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">tokens become an</text><text x="150" y="230" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">AST</text></g><g><rect x="82" y="290" width="136" height="100" rx="7" fill="#ffffff" stroke="#d7d6eb"/><text x="150" y="315" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Validated</text><text x="150" y="332" text-anchor="middle" fill="#24243d" font-family="system-ui,sans-serif" font-size="13" font-weight="650">query</text><text x="150" y="353" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">execution may</text><text x="150" y="370" text-anchor="middle" fill="#60647a" font-family="system-ui,sans-serif" font-size="12.5">begin</text></g>
  </svg>
