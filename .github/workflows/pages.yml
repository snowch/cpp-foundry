name: Verify and deploy C++ Foundry

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/toolchain
          key: wasm-toolchain-${{ runner.os }}-sdk34-clang22-v1
      - run: npm ci
      - run: python3 tools/prepare_toolchain.py
      - name: Verify generated source and readings are current
        run: |
          npm run export
          git diff --exit-code -- native dist/record-store.cpp
      - run: npm run test:native
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
        env:
          SITE_ROOT: .build/site
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: test-results/
          if-no-files-found: ignore
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
